<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="1" stop-color="#101828"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1f2937" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)" opacity="0.55"/>

  <!-- route lines motif -->
  <path d="M640 60 C 760 60, 800 150, 920 150 S 1080 240, 1160 240"
        fill="none" stroke="#34d399" stroke-width="2" opacity="0.55"/>
  <path d="M640 150 C 740 150, 780 90, 900 90 S 1100 150, 1170 150"
        fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.35"/>
  <path d="M640 240 C 720 240, 780 200, 880 200 S 1080 60, 1160 60"
        fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.3"/>
  <circle cx="920" cy="150" r="5" fill="#34d399"/>
  <circle cx="900" cy="90" r="5" fill="#60a5fa"/>
  <circle cx="880" cy="200" r="5" fill="#fbbf24"/>
  <circle cx="1160" cy="240" r="4" fill="#34d399" opacity="0.7"/>
  <circle cx="1170" cy="150" r="4" fill="#60a5fa" opacity="0.7"/>
  <circle cx="1160" cy="60" r="4" fill="#fbbf24" opacity="0.7"/>

  <!-- logo mark -->
  <g transform="translate(70, 88)">
    <rect x="0" y="0" width="124" height="124" rx="30" fill="#101828" stroke="#2a3548" stroke-width="2"/>
    <circle cx="40" cy="46" r="14" fill="none" stroke="url(#acc)" stroke-width="5"/>
    <circle cx="86" cy="80" r="14" fill="none" stroke="url(#acc)" stroke-width="5"/>
    <path d="M50 54 c 12 12 22 8 24 10" stroke="url(#acc)" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="40" cy="46" r="4.5" fill="#34d399"/>
    <circle cx="86" cy="80" r="4.5" fill="#34d399"/>
    <text x="92" y="46" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#34d399">$</text>
  </g>

  <!-- wordmark -->
  <text x="240" y="140" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="66" font-weight="800" fill="#e8ecf3" letter-spacing="-1.5">Penny<tspan fill="#34d399">Route</tspan></text>
  <text x="242" y="184" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="24" fill="#8b95a8">The frugal AI router — always route through the cheapest healthy model.</text>
  <text x="242" y="222" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#5c6579">blended pricing · health gates · automatic fallback chains · zero lock-in</text>
</svg>
